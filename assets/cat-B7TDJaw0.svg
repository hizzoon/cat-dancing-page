<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="150" rx="55" ry="50" fill="#F4A460"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="42" fill="#F4A460"/>

  <!-- Left ear -->
  <polygon points="65,50 55,18 85,45" fill="#F4A460"/>
  <polygon points="67,47 60,25 82,44" fill="#FFB6C1"/>

  <!-- Right ear -->
  <polygon points="135,50 145,18 115,45" fill="#F4A460"/>
  <polygon points="133,47 140,25 118,44" fill="#FFB6C1"/>

  <!-- Face stripes -->
  <line x1="72" y1="70" x2="62" y2="65" stroke="#D2691E" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="77" x2="58" y2="75" stroke="#D2691E" stroke-width="2" stroke-linecap="round"/>
  <line x1="128" y1="70" x2="138" y2="65" stroke="#D2691E" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="77" x2="142" y2="75" stroke="#D2691E" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="85" cy="78" rx="9" ry="10" fill="white"/>
  <ellipse cx="115" cy="78" rx="9" ry="10" fill="white"/>
  <ellipse cx="86" cy="79" rx="5" ry="6" fill="#2C2C2C"/>
  <ellipse cx="116" cy="79" rx="5" ry="6" fill="#2C2C2C"/>
  <circle cx="88" cy="77" r="2" fill="white"/>
  <circle cx="118" cy="77" r="2" fill="white"/>

  <!-- Nose -->
  <polygon points="100,90 96,95 104,95" fill="#FF69B4"/>

  <!-- Mouth -->
  <path d="M96,95 Q100,100 104,95" fill="none" stroke="#D2691E" stroke-width="1.5"/>
  <path d="M100,100 Q95,106 90,104" fill="none" stroke="#D2691E" stroke-width="1.5"/>
  <path d="M100,100 Q105,106 110,104" fill="none" stroke="#D2691E" stroke-width="1.5"/>

  <!-- Whiskers -->
  <line x1="104" y1="92" x2="130" y2="87" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="95" x2="132" y2="95" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="98" x2="130" y2="103" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96" y1="92" x2="70" y2="87" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96" y1="95" x2="68" y2="95" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96" y1="98" x2="70" y2="103" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Body stripes -->
  <path d="M75,130 Q85,125 75,118" fill="none" stroke="#D2691E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M125,130 Q115,125 125,118" fill="none" stroke="#D2691E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M92,165 Q100,158 108,165" fill="none" stroke="#D2691E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left arm (raised) -->
  <ellipse cx="52" cy="135" rx="14" ry="22" fill="#F4A460" transform="rotate(-30,52,135)"/>
  <!-- Left paw -->
  <circle cx="42" cy="118" r="10" fill="#F4A460"/>
  <circle cx="36" cy="113" r="5" fill="#F4A460"/>
  <circle cx="43" cy="110" r="5" fill="#F4A460"/>
  <circle cx="50" cy="113" r="5" fill="#F4A460"/>

  <!-- Right arm (raised) -->
  <ellipse cx="148" cy="135" rx="14" ry="22" fill="#F4A460" transform="rotate(30,148,135)"/>
  <!-- Right paw -->
  <circle cx="158" cy="118" r="10" fill="#F4A460"/>
  <circle cx="152" cy="113" r="5" fill="#F4A460"/>
  <circle cx="159" cy="110" r="5" fill="#F4A460"/>
  <circle cx="166" cy="113" r="5" fill="#F4A460"/>

  <!-- Left leg -->
  <ellipse cx="78" cy="192" rx="16" ry="20" fill="#F4A460"/>
  <ellipse cx="72" cy="207" rx="12" ry="8" fill="#F4A460"/>

  <!-- Right leg -->
  <ellipse cx="122" cy="192" rx="16" ry="20" fill="#F4A460"/>
  <ellipse cx="128" cy="207" rx="12" ry="8" fill="#F4A460"/>

  <!-- Tail -->
  <path d="M148,165 Q175,155 178,135 Q181,115 165,108" fill="none" stroke="#F4A460" stroke-width="10" stroke-linecap="round"/>
  <path d="M148,165 Q175,155 178,135 Q181,115 165,108" fill="none" stroke="#D2691E" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,8"/>
  <circle cx="165" cy="105" r="9" fill="#F4A460"/>

  <!-- Belly -->
  <ellipse cx="100" cy="155" rx="28" ry="25" fill="#FFDAB9"/>

  <!-- Blush -->
  <ellipse cx="76" cy="88" rx="9" ry="6" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="124" cy="88" rx="9" ry="6" fill="#FFB6C1" opacity="0.6"/>
</svg>
